name: Test and deploy to GitHub Pages

# Tests run on every push and pull request. The site in `site/` is deployed
# only from the repository's default branch.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per branch at a time; don't cancel a Pages deploy halfway through.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm test

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v6
      # The photo in Settings → About is the author's Gravatar. It is copied
      # into the site here, so visitors load it from this site and their
      # browsers never contact Gravatar. If the download fails the deploy
      # still goes ahead, and the card shows initials instead.
      - name: Copy the author's Gravatar into the site
        env:
          # SHA-256 of the author's email address (trimmed, lowercased), which
          # is how Gravatar looks a picture up. The address itself stays out
          # of the repository.
          GRAVATAR_HASH: 28f88af83f1bb9ce0d624c9d57d4ffaa35fbe47cd648e3f8db7c531684b695e1
        run: |
          if curl -fsSL --max-time 30 -o "$RUNNER_TEMP/me.jpg" "https://gravatar.com/avatar/$GRAVATAR_HASH.jpg?s=192&d=404"; then
            mv "$RUNNER_TEMP/me.jpg" site/me.jpg
          else
            echo "::warning::Could not download the Gravatar, so Settings → About shows initials."
          fi
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
